name: CI/CD - CidadaoConecta SP

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build-and-test:
    name: CI - Build e Testes Automatizados
    runs-on: ubuntu-latest

    steps:
      - name: Checkout do código do repositório
        uses: actions/checkout@v4

      - name: Configurar ambiente Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Instalar dependências
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Executar testes automatizados (Pytest)
        run: |
          pytest -v

  deploy:
    name: CD - Deploy na Nuvem
    needs: build-and-test
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest

    steps:
      - name: Acionar Deploy Hook no Provedor de Nuvem
        env:
          DEPLOY_HOOK_URL: ${{ secrets.RENDER_DEPLOY_HOOK }}
        run: |
          if [ -n "$DEPLOY_HOOK_URL" ]; then
            curl -fsSL -X POST "$DEPLOY_HOOK_URL"
            echo "Deploy acionado com sucesso na nuvem!"
          else
            echo "Aviso: Secret RENDER_DEPLOY_HOOK ainda não configurado. Pulando etapa."
          fi
